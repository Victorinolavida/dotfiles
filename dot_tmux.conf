# ============================================================================
# TERMINAL & COLORS
# ============================================================================
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Better Alt key support
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# ============================================================================
# GENERAL SETTINGS
# ============================================================================
set -g mouse on
# status-interval NO se pone aquí: el tema lo sobrescribe al cargar, al final
# del archivo. Se controla con @ukiyo-refresh-rate, más abajo.
set -g mode-keys vi
set -g focus-events on
set -sg escape-time 10
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1
# automatic-rename-format removed: tmux-nerd-font-window-name manages names directly

# ============================================================================
# KEY BINDINGS - PREFIX
# ============================================================================
set -g prefix C-x
unbind C-b
bind C-x send-prefix

# ============================================================================
# KEY BINDINGS - PANE NAVIGATION (VIM STYLE)
# ============================================================================
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ============================================================================
# KEY BINDINGS - PANE RESIZING
# ============================================================================
bind -n M-Up resize-pane -U 5
bind -n M-Down resize-pane -D 5
bind -n M-Left resize-pane -L 5
bind -n M-Right resize-pane -R 5

# ============================================================================
# KEY BINDINGS - WINDOW SWITCHING
# ============================================================================
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9

# ============================================================================
# KEY BINDINGS - SPLITS (MAINTAIN CURRENT PATH)
# ============================================================================
bind '%' split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind '|' split-window -h -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"

# ============================================================================
# KEY BINDINGS - RELOAD
# ============================================================================
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# ============================================================================
# KEY BINDINGS - POPUPS
# ============================================================================
# Floating scratch window (Alt + g)
bind-key -n M-g if-shell -F '#{==:#{session_name},scratch}' \
  "detach-client" \
  "display-popup -E 'tmux new-session -A -s scratch'"

# Terminal popup (Alt + t) — was C-t, conflicted with shell transpose-chars
bind -n M-t display-popup \
  -d "#{pane_current_path}" \
  -w 75% \
  -h 75% \
  -E "$SHELL"

# Tmux sessionizer (prefix + f)
bind-key f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"

# Los bindings de búsqueda están al final del archivo, después de TPM

# ============================================================================
# KEY BINDINGS - COPY MODE
# ============================================================================
set -s set-clipboard external

if-shell 'uname | grep -q Darwin' {
  bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
  bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
  bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
} {
  bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"
  bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"
  bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"
}

# ============================================================================
# PANE BORDERS
# ============================================================================
# pane-border-format se quitó junto con la paleta @thm_* a mano: lo coloreaba
# con esas variables, que ya no existen. El estilo lo pone ahora el tema.
set -g pane-border-lines heavy
set -g pane-border-status top

# ============================================================================
# THEME - KANAGAWA DRAGON
# ============================================================================
# Antes esto era catppuccin con una paleta Kanagawa de 30 líneas puesta a mano
# encima, más un `run` manual del plugin. Ahora el tema es un plugin de verdad
# que gestiona TPM como todos los demás, así que la paleta ya no se mantiene
# aquí: la trae el propio tema y sigue a kanagawa.nvim.
#
# El nombre del repo es tmux-kanagawa pero la API de opciones es @ukiyo-*
# (con guion, no guion bajo), porque el plugin es un fork del tema ukiyo.
# La variante se elige con "tema/variante"; dragon es la que iguala al
# `kanagawa-dragon` de nvim (wave y lotus son las otras dos).
set -g @plugin 'Nybkox/tmux-kanagawa'
set -g @ukiyo-theme 'kanagawa/dragon'

# ============================================================================
# STATUS BAR
# ============================================================================
# status-left/right, window-status-format y los estilos de ventana los escribe
# el tema al cargarse (al final, en la línea de TPM), así que definirlos aquí
# no serviría de nada: se sobrescriben. Solo queda lo que el tema no toca.
set -g status-position top

# Módulos de la derecha, en el orden en que aparecen. Los tres funcionan en
# macOS (probados: battery lee pmset, no /sys). Se dejan fuera cpu-usage y
# ram-usage a propósito: son dos números que casi nunca se miran y obligan a
# muestrear en cada refresco.
#   git      -> rama + símbolo de sucio. No hace fetch ni toca la red, así que
#               no bloquea la barra en repos grandes ni con remotos lentos.
#   battery  -> es un portátil.
#   time     -> lo que ya había.
set -g @ukiyo-plugins 'git battery time'

# El icono de la izquierda es el nombre de sesión, y cambia de color cuando el
# prefijo está pulsado. Con el sessionizer abriendo una sesión por proyecto,
# saber en cuál estás vale más que cualquier módulo de la derecha.
set -g @ukiyo-left-icon session

set -g @ukiyo-show-powerline true
set -g @ukiyo-show-flags true      # marca ventana con zoom, actividad, etc.

# Formato explícito en vez de @ukiyo-military-time / @ukiyo-day-month: esos dos
# eligen entre mm/dd y dd/mm, y con la fecha en ISO no hay que elegir. Es el
# mismo formato que tenía el date_time de catppuccin.
set -g @ukiyo-time-format '%Y-%m-%d %H:%M'

# Este es el status-interval de verdad (ver arriba). 5s es el valor por
# defecto del tema y es lo que marca cada cuánto se relanza el módulo de git.
set -g @ukiyo-refresh-rate 5

# ============================================================================
# PLUGINS - CORE
# ============================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# ============================================================================
# PLUGINS - UTILITIES
# ============================================================================
set -g @fuzzback-bind '/'
set -g @fuzzback-hide-preview 1
set -g @plugin 'roosta/tmux-fuzzback'

set -g @plugin 'omerxx/tmux-sessionx'
set -g @sessionx-bind 'o'

# tmux-mem-cpu-load removed — not referenced in status bar, was running for nothing

set -g @plugin 'jaclu/tmux-menus'
set -g @menus_trigger 'b'


set -g @plugin 'rickstaa/tmux-notify'

set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'

# tmux-neolazygit eliminado — lazygit se lanza desde el shell, y el plugin se
# quedaba con prefix+G ignorando @neolazygit_open. El binario lazygit sigue
# instalándose desde .chezmoiscripts; solo se va la integración con tmux.

set -g @plugin 'tmux-plugins/tmux-logging'
set -g @logging-path "$HOME/.config/tmux/logs"

set -g @plugin 'laktak/extrakto'
set -g @extrakto_key 'e'

set -g @plugin 'alexwforsythe/tmux-which-key'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'

set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'off'
set -g @continuum-save-interval '60'

# tmux-pane-focus removed — fires resize-pane on every focus change, causes lag

# ============================================================================
# INITIALIZE TPM (KEEP AT BOTTOM)
# ============================================================================
run '~/.tmux/plugins/tpm/tpm'

# ============================================================================
# BÚSQUEDA — DESPUÉS DE TPM A PROPÓSITO
# ============================================================================
# Los plugins registran sus bindings al cargarse, es decir en la línea `run` de
# arriba, así que pisan cualquier tecla que se haya enlazado antes. Ya pasó con
# neolazygit, que se quedaba con prefix+G ignorando su propia opción. Definir
# estos al final garantiza que sobrevivan a lo que enlace cualquier plugin.
# C-f/C-g/C-h no los usa nadie hoy, así que tampoco le robamos la tecla a nadie.

# Regex sobre el CONTENIDO de los archivos (prefix + C-g).
# En ventana nueva y no en popup, porque abre el editor y debe sobrevivir.
bind-key C-g run-shell "tmux neww -c '#{pane_current_path}' ~/.local/bin/search-content"

# Regex sobre el NOMBRE de los archivos (prefix + C-f)
bind-key C-f run-shell "tmux neww -c '#{pane_current_path}' ~/.local/bin/search-files"

# Historial de comandos (prefix + C-h). Popup, porque solo elige y escribe el
# comando en el panel de origen, que se le pasa como pane-id.
bind-key C-h display-popup -E -w 80% -h 60% "~/.local/bin/search-history '#{pane_id}'"
