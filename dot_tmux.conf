# ============================================================================
# TERMINAL & COLORS
# ============================================================================
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Better Alt key support
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# ============================================================================
# GENERAL SETTINGS
# ============================================================================
set -g mouse on
set -g status-interval 10
set -g mode-keys vi
set -g focus-events on
set -sg escape-time 10
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1
# automatic-rename-format removed: tmux-nerd-font-window-name manages names directly

# ============================================================================
# KEY BINDINGS - PREFIX
# ============================================================================
set -g prefix C-x
unbind C-b
bind C-x send-prefix

# ============================================================================
# KEY BINDINGS - PANE NAVIGATION (VIM STYLE)
# ============================================================================
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ============================================================================
# KEY BINDINGS - PANE RESIZING
# ============================================================================
bind -n M-Up resize-pane -U 5
bind -n M-Down resize-pane -D 5
bind -n M-Left resize-pane -L 5
bind -n M-Right resize-pane -R 5

# ============================================================================
# KEY BINDINGS - WINDOW SWITCHING
# ============================================================================
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9

# ============================================================================
# KEY BINDINGS - SPLITS (MAINTAIN CURRENT PATH)
# ============================================================================
bind '%' split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind '|' split-window -h -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"

# ============================================================================
# KEY BINDINGS - RELOAD
# ============================================================================
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# ============================================================================
# KEY BINDINGS - POPUPS
# ============================================================================
# Floating scratch window (Alt + g)
bind-key -n M-g if-shell -F '#{==:#{session_name},scratch}' \
  "detach-client" \
  "display-popup -E 'tmux new-session -A -s scratch'"

# Terminal popup (Alt + t) — was C-t, conflicted with shell transpose-chars
bind -n M-t display-popup \
  -d "#{pane_current_path}" \
  -w 75% \
  -h 75% \
  -E "$SHELL"

# Tmux sessionizer (prefix + f)
bind-key f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"

# Los bindings de búsqueda están al final del archivo, después de TPM

# ============================================================================
# KEY BINDINGS - COPY MODE
# ============================================================================
set -s set-clipboard external

if-shell 'uname | grep -q Darwin' {
  bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
  bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
  bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
} {
  bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"
  bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"
  bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"
}

# ============================================================================
# PANE BORDERS
# ============================================================================
# pane-border-style and pane-active-border-style removed — catppuccin overwrites
# them after run; configure via @catppuccin_pane_border_style instead
set -g pane-border-lines heavy
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[fg=#{@thm_lavender} bold] ● #[fg=#{@thm_fg}]#{pane_current_command} ,#[fg=#{@thm_surface_1}] ○ #[fg=#{@thm_overlay_0}]#{pane_current_command} }"

# ============================================================================
# THEME - KANAGAWA DRAGON (via catppuccin's engine)
# ============================================================================
# Colors are Kanagawa Dragon, matching nvim's `kanagawa-dragon`. The standalone
# tmux ports (Nybkox/tmux-ukiyo, TSoli/kanagawa-dragon-tmux) each replace the
# whole status bar with their own @ukiyo_*/@kanagawa_* option API, which would
# mean rewriting pane-border-format and status-right below. Instead we keep
# catppuccin as the rendering engine and just swap its palette.
#
# This MUST stay above the `run` line: catppuccin assigns @thm_* with
# `set -ogq`, and -o means "don't overwrite an option that is already set",
# so whatever is defined first wins. Plain `set -g` here (not -og) so a
# `prefix + r` reload overwrites the values left in the running server.
#
# Palette source: kanagawa.nvim dragon (dragonBlack0-6, dragonWhite, …)
set -g @thm_bg "#181616"
set -g @thm_fg "#c5c9c5"

# Accent colors
set -g @thm_rosewater "#b98d7b"
set -g @thm_flamingo "#b6927b"
set -g @thm_pink "#a292a3"
set -g @thm_mauve "#8992a7"
set -g @thm_red "#c4746e"
set -g @thm_maroon "#c4746e"
set -g @thm_peach "#b6927b"
set -g @thm_yellow "#c4b28a"
set -g @thm_green "#87a987"
set -g @thm_teal "#949fb5"
set -g @thm_sky "#8ea4a2"
set -g @thm_sapphire "#8ba4b0"
set -g @thm_blue "#658594"
set -g @thm_lavender "#8992a7"

# Surfaces and overlays
set -g @thm_subtext_1 "#a6a69c"
set -g @thm_subtext_0 "#9e9b93"
set -g @thm_overlay_2 "#7a8382"
set -g @thm_overlay_1 "#737c73"
set -g @thm_overlay_0 "#625e5a"
set -g @thm_surface_2 "#393836"
set -g @thm_surface_1 "#282727"
set -g @thm_surface_0 "#1d1c19"
set -g @thm_mantle "#12120f"
set -g @thm_crust "#0d0c0c"

set -g @plugin 'catppuccin/tmux'
# Flavor is effectively inert now — every @thm_* it would set is already
# defined above — but it is kept so catppuccin has a valid theme to load.
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style "rounded"

# Run catppuccin manually (not via TPM) so status-right config below takes effect
run ~/.tmux/plugins/tmux/catppuccin.tmux

# ============================================================================
# STATUS BAR
# ============================================================================
set -g status-position top
set -g status-left ""
set -g @catppuccin_pane_default_text "##{b:pane_current_path}"
set -g @catppuccin_pane_active_border_style "##{?pane_in_mode,fg=#{@thm_lavender},##{?pane_synchronized,fg=#{@thm_mauve},fg=#{@thm_lavender}}}"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

set -g status-right-length 400
set -g status-right ""
set -agF status-right "#{E:@catppuccin_status_date_time}"

# ============================================================================
# PLUGINS - CORE
# ============================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# ============================================================================
# PLUGINS - UTILITIES
# ============================================================================
set -g @fuzzback-bind '/'
set -g @fuzzback-hide-preview 1
set -g @plugin 'roosta/tmux-fuzzback'

set -g @plugin 'omerxx/tmux-sessionx'
set -g @sessionx-bind 'o'

# tmux-mem-cpu-load removed — not referenced in status bar, was running for nothing

set -g @plugin 'jaclu/tmux-menus'
set -g @menus_trigger 'b'


set -g @plugin 'rickstaa/tmux-notify'

set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'

set -g @plugin 'AngryMorrocoy/tmux-neolazygit'
set -g @neolazygit_open 'g'

set -g @plugin 'tmux-plugins/tmux-logging'
set -g @logging-path "$HOME/.config/tmux/logs"

set -g @plugin 'laktak/extrakto'
set -g @extrakto_key 'e'

set -g @plugin 'alexwforsythe/tmux-which-key'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'

set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'off'
set -g @continuum-save-interval '60'

# tmux-pane-focus removed — fires resize-pane on every focus change, causes lag

# ============================================================================
# INITIALIZE TPM (KEEP AT BOTTOM)
# ============================================================================
run '~/.tmux/plugins/tpm/tpm'

# ============================================================================
# BÚSQUEDA — DESPUÉS DE TPM A PROPÓSITO
# ============================================================================
# Los plugins registran sus bindings al cargarse, es decir en la línea `run` de
# arriba, así que pisan cualquier tecla que se haya enlazado antes. Ya pasó:
# neolazygit se queda con prefix+G aunque @neolazygit_open valga 'g'. Definir
# estos al final garantiza que sobrevivan a lo que enlace cualquier plugin.
# C-f/C-g/C-h no los usa nadie hoy, así que tampoco le robamos la tecla a nadie.

# Regex sobre el CONTENIDO de los archivos (prefix + C-g).
# En ventana nueva y no en popup, porque abre el editor y debe sobrevivir.
bind-key C-g run-shell "tmux neww -c '#{pane_current_path}' ~/.local/bin/search-content"

# Regex sobre el NOMBRE de los archivos (prefix + C-f)
bind-key C-f run-shell "tmux neww -c '#{pane_current_path}' ~/.local/bin/search-files"

# Historial de comandos (prefix + C-h). Popup, porque solo elige y escribe el
# comando en el panel de origen, que se le pasa como pane-id.
bind-key C-h display-popup -E -w 80% -h 60% "~/.local/bin/search-history '#{pane_id}'"
